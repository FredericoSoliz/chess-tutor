services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    depends_on:
      - db
      - engine-service
    env_file:
      - ./backend/.env
    environment:
      GIN_MODE: release
      ENGINE_SERVICE_URL: http://engine-service:5000

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8080
      - CHOKIDAR_USEPOLLING=true
  
  engine-service:
    build: ./engine-service
    ports:
      - "5000:5000"
    environment:
      - STOCKFISH_PATH=/usr/games/stockfish
      - LLM_BASE_URL=http://host.docker.internal:1234/v1
      - LLM_MODEL=qwen2.5-7b-instruct
      - LLM_API_KEY=lm-studio
      - LLM_TIMEOUT=15
    extra_hosts:
      - "host.docker.internal:host-gateway"
      
  db:
    image: postgres:15
    container_name: chess-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chess
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: