services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    depends_on:
      - db
      - ai-service
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: chess
      DB_PORT: 5432
      AI_SERVICE_URL: http://ai-service:5000

  ai-service:
    build: ./ai-service
    ports:
      - "5000:5000"
    environment:
      - STOCKFISH_PATH=/usr/games/stockfish
      
  db:
    image: postgres:15
    container_name: chess-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chess
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: